# ==========================
# ===  General settings  ===
# ==========================

set -g allow-passthrough on
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-features "*:hyperlinks"
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on
set-option -g renumber-windows on
set-option -g focus-events on
set -g extended-keys on
set -g extended-keys-format "csi-u"
set -g xterm-keys on
set -sg escape-time 10

# Change prefix key to C-a, easier to type, same to "screen"
unbind C-b
set -g prefix 'C-a'

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on


# ==========================
# ===   Key bindings     ===
# ==========================

# toggle pane title visibility
bind T run 'zsh -c "arr=( off top ) && tmux setw pane-border-status \${arr[\$(( \${arr[(I)#{pane-border-status}]} % 2 + 1 ))]}"'
# rename pane
bind t command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"

# Edit configuration and reload
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-nvim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"

# new window and retain cwd
bind c new-window -c "#{pane_current_path}"

# Prompt to rename window right after it's created
set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

# Rename session and window
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Select pane and windows
# bind -r C-[ previous-window
# bind -r C-] next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r C-o swap-pane -D

# Zoom pane
bind + resize-pane -Z

# Kill pane/window/session shortcuts
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Detach from session
bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# Hide status bar on demand
# bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================
set -s set-clipboard on

bind P paste-buffer

# Prefer vi style key table
setw -g mode-keys vi

bind v copy-mode
# For binding 'y' to copy and exiting selection mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g status-style fg=grey,bg=black
set -g status-position top
set -g status-justify left
set -g window-status-separator ""
set -g status-left "#[bg=colour241,fg=colour248] #S #[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]"
setw -g window-status-current-format "#[bg=colour214,fg=colour237,nobold,noitalics,nounderscore]#[bg=colour214,fg=colour239] #I #[bg=colour214,fg=colour239,bold] #W#{?window_zoomed_flag,*Z,} #[bg=colour237,fg=colour214,nobold,noitalics,nounderscore]"
setw -g window-status-format "#[bg=colour239,fg=colour237,noitalics]#[bg=colour239,fg=colour223] #I #[bg=colour239,fg=colour223] #W #[bg=colour237,fg=colour239,noitalics]"
set -g status-right "#{prefix_highlight} #[bg=colour241,fg=colour248]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors -a 0 -g 0 --powerline-right --interval 1) #[fg=green]#[fg=black,bg=green] #{network_bandwidth} #[default]"

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'xamut/tmux-network-bandwidth'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'rickstaa/tmux-notify'

# tmux-yank: use OSC 52 (works without X display)
set -g @override_copy_command 'tmux load-buffer -w -'
set -g @yank_selection_mouse 'clipboard'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: auto save & auto restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-continuum settings
set -g @continuum-save-interval '15'  # Auto-save every 15 minutes
set -g @continuum-restore 'on'        # Auto-restore on tmux server start

# Plugin properties
set -g @open-S 'https://www.google.com/search?q='

# Run all plugins' scripts
run '~/.tmux/plugins/tpm/tpm'

# =============================
# ===  Workmux (agent mgr) ===
# =============================

# Dashboard window: prefix + Ctrl-s — jump to full-screen persistent dashboard (window 0)
# Dashboard auto-restarts after jumping to agent, never exits
bind C-s if-shell 'tmux list-windows -F "#{window_name}" | grep -q "📊"' \
  'select-window -t "📊"' \
  'neww -t 0 -n "📊" "while true; do workmux dashboard; done"'

# Sidebar: prefix + Ctrl-t — toggle left sidebar with agent status
bind C-t run-shell "workmux sidebar"

# l = tmux default last-window. Ctrl-l = jump to agent needing attention
bind l last-window
bind C-l run-shell "workmux last-done"

# Cycle through all agents: prefix + Tab (forward), prefix + Shift-Tab (backward)
bind Tab run-shell "workmux sidebar next"
bind BTab run-shell "workmux sidebar prev"

# Auto-create persistent dashboard at window 0 for every new session
set-hook -g after-new-session 'neww -d -t 0 -n "📊" "while true; do workmux dashboard; done"'

# Auto-start sidebar on fresh tmux server
if-shell '! pgrep -f "workmux _sidebar-daemon" > /dev/null' 'run-shell "sleep 1 && workmux sidebar"'
